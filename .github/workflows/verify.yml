name: verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: MVP verification (Lean 4.25.0)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Installs elan. The Lean version is pinned by ./lean-toolchain
      # (leanprover/lean4:v4.25.0), not by this workflow. No build, test, lint,
      # Mathlib cache, or Lake cache is requested here: scripts/verify.sh owns
      # the single build/check path, and this project has no Mathlib dependency.
      - name: Install pinned Lean toolchain
        uses: leanprover/lean-action@v1
        with:
          auto-config: "false"
          build: "false"
          test: "false"
          lint: "false"
          use-mathlib-cache: "false"
          use-github-cache: "false"

      - name: Run full verification
        run: scripts/verify.sh
